version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: environment/local
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directory: /
    target-branch: environment/local
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(ci)

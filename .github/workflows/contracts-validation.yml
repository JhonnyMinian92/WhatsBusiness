name: Contract validation

on:
  push:
    branches: [environment/local]
    paths:
      - "contracts/**"
      - "scripts/validate-contracts.mjs"
      - ".github/workflows/contracts-validation.yml"
      - "redocly.yaml"
  pull_request:
    branches: [environment/local]
    paths:
      - "contracts/**"
      - "scripts/validate-contracts.mjs"
      - ".github/workflows/contracts-validation.yml"
      - "redocly.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install isolated contract validators
        run: npm install --no-save --package-lock=false yaml@2.8.1 ajv@8.17.1 ajv-formats@3.0.1
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint contracts/openapi/platform-v1.yaml
      - name: Validate AsyncAPI
        run: npx --yes @asyncapi/cli@3.4.2 validate contracts/asyncapi/platform-events-v1.yaml
      - name: Validate event schemas, references and fixtures
        run: node scripts/validate-contracts.mjs

name: Contract validation

on:
  push:
    branches: [environment/local]
    paths:
      - "contracts/**"
      - "scripts/validate-contracts.mjs"
      - ".github/workflows/contracts-validation.yml"
      - "redocly.yaml"
  pull_request:
    branches: [environment/local]
    paths:
      - "contracts/**"
      - "scripts/validate-contracts.mjs"
      - ".github/workflows/contracts-validation.yml"
      - "redocly.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install isolated contract validators outside the pnpm workspace
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/whatsbusiness-contract-tools"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          npm init --yes
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund yaml@2.8.1 ajv@8.17.1 ajv-formats@3.0.1
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint contracts/openapi/platform-v1.yaml
      - name: Validate AsyncAPI
        run: npx --yes @asyncapi/cli@3.4.2 validate contracts/asyncapi/platform-events-v1.yaml
      - name: Validate event schemas, references and fixtures
        env:
          CONTRACT_TOOLS_REQUIRE_BASE: ${{ runner.temp }}/whatsbusiness-contract-tools/contract-tools.cjs
        run: node scripts/validate-contracts.mjs

name: Source workspace validation

on:
  push:
    branches: [environment/local]
    paths:
      - "apps/**"
      - "microservices-meta-ecuapp/**"
      - "libs/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "nx.json"
      - "angular.json"
      - "tsconfig.base.json"
      - ".node-version"
      - ".npmrc"
      - ".github/workflows/source-validation.yml"
  pull_request:
    branches: [environment/local]
    paths:
      - "apps/**"
      - "microservices-meta-ecuapp/**"
      - "libs/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "nx.json"
      - "angular.json"
      - "tsconfig.base.json"
      - ".node-version"
      - ".npmrc"
      - ".github/workflows/source-validation.yml"
  workflow_dispatch:

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      rabbitmq:
        image: rabbitmq:4.4.0-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: whatsbusiness
          RABBITMQ_DEFAULT_PASS: ci-rabbit-password
        ports:
          - 5672:5672
          - 15672:15672
          - 15692:15692
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: whatsbusiness_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d whatsbusiness_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://whatsbusiness_app:ci-runtime-password@127.0.0.1:5432/whatsbusiness_ci
      DATABASE_JOB_DISPATCHER_URL: postgresql://whatsbusiness_job_dispatcher:ci-dispatcher-password@127.0.0.1:5432/whatsbusiness_ci
      DATABASE_JOB_WORKER_URL: postgresql://whatsbusiness_job_worker:ci-worker-password@127.0.0.1:5432/whatsbusiness_ci
      DATABASE_WEBHOOK_WORKER_URL: postgresql://whatsbusiness_webhook_worker:ci-webhook-worker-password@127.0.0.1:5432/whatsbusiness_ci
      MIGRATION_DATABASE_URL: postgresql://postgres:ci-postgres-password@127.0.0.1:5432/whatsbusiness_ci
      RABBITMQ_URL: amqp://whatsbusiness:ci-rabbit-password@127.0.0.1:5672/%2F
      RABBITMQ_PROMETHEUS_URL: http://127.0.0.1:15692
      NODE_ENV: test
      RUN_APPROVAL_INTEGRATION_TESTS: "true"
      RUN_TENANT_JOB_RUNTIME_INTEGRATION_TESTS: "true"
      RUN_RABBITMQ_INTEGRATION_TESTS: "true"
      RUN_META_WEBHOOK_INTEGRATION_TESTS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Synchronize lockfile and verify frozen installation
        id: install
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && ! -f pnpm-lock.yaml ]]; then
            echo "::error::pnpm-lock.yaml must be committed for pull requests."
            exit 1
          fi
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile
          if [[ -n "$(git status --porcelain -- pnpm-lock.yaml)" ]]; then
            echo "lockfile_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "lockfile_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Provision restricted API database role
        run: |
          psql "$MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE whatsbusiness_app
            LOGIN PASSWORD 'ci-runtime-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          SQL

      - name: Apply versioned PostgreSQL migrations
        run: pnpm db:migrate

      - name: Provision least-privilege job runtime logins
        run: |
          psql "$MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE whatsbusiness_job_dispatcher
            LOGIN PASSWORD 'ci-dispatcher-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOBYPASSRLS;
          GRANT whatsbusiness_job_dispatcher_role TO whatsbusiness_job_dispatcher;
          CREATE ROLE whatsbusiness_job_worker
            LOGIN PASSWORD 'ci-worker-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOBYPASSRLS;
          GRANT whatsbusiness_job_worker_role TO whatsbusiness_job_worker;
          SQL

      - name: Verify versioned migrations are idempotent
        run: pnpm db:migrate

      - name: Provision least-privilege Meta webhook worker login
        run: |
          psql "$MIGRATION_DATABASE_URL" --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE whatsbusiness_webhook_worker
            LOGIN PASSWORD 'ci-webhook-worker-password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOBYPASSRLS;
          GRANT whatsbusiness_webhook_worker_role TO whatsbusiness_webhook_worker;
          SQL

      - name: Configure durable quorum dead-letter policy
        run: docker exec "${{ job.services.rabbitmq.id }}" rabbitmqctl set_policy --apply-to quorum_queues --priority 50 whatsbusiness-jobs-quorum-dlx '^whatsbusiness\.jobs\.worker\.v1$' '{"dead-letter-exchange":"whatsbusiness.jobs.dlx","dead-letter-routing-key":"jobs.dead","dead-letter-strategy":"at-least-once","overflow":"reject-publish","delivery-limit":5,"max-length-bytes":268435456}'

      - name: Enable RabbitMQ Prometheus plugin
        shell: bash
        run: |
          docker exec "${{ job.services.rabbitmq.id }}" rabbitmq-plugins enable rabbitmq_prometheus
          for attempt in {1..30}; do
            if curl --fail --silent "$RABBITMQ_PROMETHEUS_URL/metrics" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::RabbitMQ Prometheus endpoint did not become ready."
          exit 1

      - name: Build all applications
        run: pnpm build

      - name: Typecheck all applications
        run: pnpm typecheck

      - name: Run unit and PostgreSQL/RabbitMQ integration tests
        run: pnpm test

      - name: Require lockfile synchronization in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- pnpm-lock.yaml)" ]]; then
            echo "::error::pnpm-lock.yaml is out of date. Regenerate and commit it with the dependency change."
            exit 1
          fi

      - name: Commit verified lockfile on the authorized branch
        if: github.event_name == 'push' && steps.install.outputs.lockfile_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: commit validated pnpm lockfile"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin "HEAD:environment/local"

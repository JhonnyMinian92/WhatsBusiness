name: whatsbusiness-task039-lab

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: \${POSTGRES_DB:?Copy .env.example to .env first}
      POSTGRES_USER: \${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_RUNTIME_PASSWORD: \${APP_RUNTIME_PASSWORD:?Set APP_RUNTIME_PASSWORD}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/schema:/lab-schema:ro
      - ./postgres/tests:/lab-tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: \${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: \${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:56729:5672"
      - "127.0.0.1:15679:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.0
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "\${VALKEY_PASSWORD:?Set VALKEY_PASSWORD}"]
    ports:
      - "127.0.0.1:16389:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080", "--hostname-strict=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: \${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: \${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./keycloak/realm-import:/opt/keycloak/data/import:ro

volumes:
  postgres_data:
  valkey_data:

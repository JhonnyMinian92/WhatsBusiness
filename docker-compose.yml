services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: whatsbusiness
      POSTGRES_USER: whatsbusiness
      POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:-whatsbusiness-local-only}
    ports: ["5432:5432"]
    volumes:
      - whatsbusiness-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsbusiness -d whatsbusiness"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: { context: ., dockerfile: Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://whatsbusiness:\${POSTGRES_PASSWORD:-whatsbusiness-local-only}@postgres:5432/whatsbusiness
      HOST: 0.0.0.0
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  whatsbusiness-postgres:

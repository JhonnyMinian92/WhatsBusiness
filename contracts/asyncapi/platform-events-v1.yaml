asyncapi: 2.6.0
info:
  title: WhatsBusiness Platform Events
  version: 1.0.0
  description: >
    Full internal domain event catalog, 70 versioned event types with explicit publish and subscribe operations. Delivery is at-least-once.
    This contract does not claim producers, consumers, broker topology or runtime behavior exist.
defaultContentType: application/json
servers:
  local:
    url: amqp://rabbitmq:5672
    protocol: amqp
    description: Local development broker; topology and credentials are environment-specific.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    BadRequest:
      description: Invalid syntax, malformed JSON, unsupported media type, or invalid parameter encoding.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, invalid, expired, or revoked authentication credentials.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Actor is authenticated but lacks the required permission, membership, grant, purpose, entitlement, or approval.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource does not exist or is not visible to this actor; cross-tenant existence is not disclosed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict, stale version, idempotency-key conflict, or illegal lifecycle transition.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: Business validation, policy, consent, capability, or domain invariant failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Webhook payload exceeds the product-specific maximum body size.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Rate or quota limit exceeded. Retry-After may be present.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: Unexpected internal failure. Response must not expose stack traces, SQL, secrets, or personal data.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Required dependency unavailable or operation temporarily unavailable.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ContractNotFrozen:
      description: Contract is catalog-only and not approved for implementation; this response documents the current design gate, not a runtime API behavior.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        timestamp:
          type: string
          format: date-time
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [ok, degraded, failed] }
    CurrentPrincipal:
      type: object
      additionalProperties: false
      required: [userId, memberships]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: [string, "null"] }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
    MembershipSummary:
      type: object
      additionalProperties: false
      required: [tenantId, tenantName, membershipStatus, roleKeys]
      properties:
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        membershipStatus: { type: string, enum: [active, invited, suspended, revoked] }
        roleKeys:
          type: array
          items: { type: string }
    TenantList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MembershipSummary' }
        nextCursor: { type: [string, "null"] }
    TenantContext:
      type: object
      additionalProperties: false
      required: [tenantId, membershipStatus, roleKeys, permissionKeys, locale, timezone, currency]
      properties:
        tenantId: { type: string, format: uuid }
        membershipStatus: { type: string, enum: [active] }
        roleKeys:
          type: array
          items: { type: string }
        permissionKeys:
          type: array
          items: { type: string }
        delegatedGrant:
          type: [object, "null"]
          properties:
            grantId: { type: string, format: uuid }
            expiresAt: { type: string, format: date-time }
        locale: { type: string, default: es-EC }
        timezone: { type: string, default: America/Guayaquil }
        currency: { type: string, pattern: '^[A-Z]{3}$', default: USD }
        entitlementKeys:
          type: array
          items: { type: string }
    Problem:
      type: object
      additionalProperties: true
      required: [title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        detail: { type: string }
        correlationId: { type: string, format: uuid }
        errors:
          type: array
          items:
            type: object
            required: [path, code]
            properties:
              path: { type: string }
              code: { type: string }
    ContactCreateRequest:
      type: object
      additionalProperties: false
      required: [contactType, displayName, sourceType]
      properties:
        contactType: { type: string, enum: [person, organization] }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        firstName: { type: [string, "null"], minLength: 1, maxLength: 120 }
        lastName: { type: [string, "null"], minLength: 1, maxLength: 120 }
        sourceType: { type: string, enum: [manual, api, import, webhook] }
        sourceReference: { type: [string, "null"], minLength: 1, maxLength: 255 }
        sourceCapturedAt: { type: [string, "null"], format: date-time }
    ContactUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        firstName: { type: [string, "null"], minLength: 1, maxLength: 120 }
        lastName: { type: [string, "null"], minLength: 1, maxLength: 120 }
        status: { type: string, enum: [active, archived] }
    ContactRecord:
      type: object
      additionalProperties: false
      required: [id, tenantId, contactType, displayName, firstName, lastName, status, sourceType, sourceReference, sourceCapturedAt, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        contactType: { type: string, enum: [person, organization] }
        displayName: { type: string }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        status: { type: string, enum: [active, archived] }
        sourceType: { type: string, enum: [manual, api, import, webhook] }
        sourceReference: { type: [string, "null"] }
        sourceCapturedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ContactListResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContactRecord' }
        nextCursor: { type: [string, "null"], maxLength: 1024 }

